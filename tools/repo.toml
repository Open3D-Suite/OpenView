# What the common OPEN3D tools need to know about this repository. tools/repo.py reads it:
# tools/check.ps1 runs the checks, "python -I tools/repo.py version set X.Y.Z" writes a new version,
# "python -I tools/repo.py package" makes the release package and "release X.Y.Z" the release.

# Where the version lives (`source`) and the other places that repeat it. Each one is a file and a
# pattern whose one group is the version; "^" is the start of a line.
[version]
source = { file = "Cargo.toml", pattern = '^version = "([^"]+)"' }
places = [
    { file = "Cargo.lock", pattern = '^name = "openview"\nversion = "([^"]+)"' },
    { file = "README.md", pattern = '^\*\*Version ([^*]+)\*\*' },
]
# Run after a new version is written: cargo looks Cargo.lock over, without touching the libraries.
after_set = [["cargo", "update", "--workspace", "--offline"]]

# The checks, in the order they run. `full = true` marks one that only tools/check.ps1 -Full runs.
[[check]]
name = "cargo fmt"
run = ["cargo", "fmt", "--all", "--check"]

[[check]]
name = "cargo clippy"
run = ["cargo", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"]

[[check]]
name = "cargo test"
run = ["cargo", "test", "--locked"]

[[check]]
name = "ruff format"
run = ["ruff", "format", "--check", "."]

[[check]]
name = "ruff check"
run = ["ruff", "check", "."]

# The tests against the real map service: they need the network and depend on a third party.
[[check]]
name = "cargo test live"
run = ["cargo", "test", "--locked", "--test", "live", "--", "--ignored"]
full = true

# The release package: dist/openview-<version>-windows-x64.zip, with OpenView.exe at its root, and
# dist/SHA256SUMS.txt. The launcher installs it from there.
[package]
name = "OpenView"
build = [["cargo", "build", "--release", "--locked"]]
# THIRD-PARTY-LICENSES.txt: every library cargo links in, with its licence checked and its texts.
third_party = "cargo"
files = [
    { from = "{cargo_target}/release/OpenView.exe", to = "OpenView.exe" },
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    # The licence of the original OpenView, whose code this one includes (MIT).
    "LICENSES/*.txt",
]
exe = "OpenView.exe"
version_answer = "OpenView {version}"
